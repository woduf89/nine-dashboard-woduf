<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>9호선 운행 대시보드</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg2: #1e293b;
      --bg3: #334155;
      --bg4: #475569;
      --txt: #f8fafc;
      --txt2: #94a3b8;
      --txt3: #64748b;
      --gold: #f59e0b;
      --gold-bg: rgba(245, 158, 11, 0.15);
      --gold-dim: rgba(245, 158, 11, 0.3);
      --red: #ef4444;
      --orange: #f97316;
      --green: #10b981;
      --blue: #3b82f6;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--txt); -webkit-tap-highlight-color: transparent; }

    /* ── 내 열차 기준 간격 패널 (중앙 집중형) ── */
    .gap-panel {
      margin: 12px 14px 0;
      background: var(--bg2);
      border: 1.5px solid var(--gold-dim);
      border-radius: var(--radius);
      padding: 16px 14px;
    }
    .gap-panel-title {
      font-size: 13px;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
    }

    /* 세로 카드 배치 */
    .gap-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* 간격 카드 상자 */
    .gap-box {
      background: var(--bg3);
      border-radius: var(--radius-sm);
      padding: 12px 10px;
      text-align: center;
      border: 1px solid var(--bg4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease;
    }
    .gap-box.warn { border-color: var(--red); }
    .gap-box.caution { border-color: var(--orange); }
    .gap-box.ok { border-color: var(--green); }

    /* 내 열차 전용 카드 스타일 (가운데 강조) */
    .gap-box.my-box {
      background: var(--gold-bg);
      border: 2px solid var(--gold);
      padding: 14px 10px;
    }

    .gap-dir {
      font-size: 11px;
      color: var(--txt2);
      margin-bottom: 4px;
      font-weight: 600;
    }

    /* 열차번호: 분/초 시계 크기와 비슷하게 큼직하게 정렬 */
    .gap-train-no {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
      line-height: 1.2;
    }
    .gap-box.my-box .gap-train-no {
      color: var(--gold);
      font-size: 28px;
    }

    /* 분/초 타이머 */
    .gap-time {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.1;
      margin-top: 4px;
    }
    .gap-time.warn { color: var(--red); }
    .gap-time.caution { color: var(--orange); }
    .gap-time.ok { color: var(--green); }

    .gap-stn {
      font-size: 11px;
      color: var(--txt2);
      margin-top: 4px;
    }
    .gap-stations {
      font-size: 10px;
      color: var(--txt3);
      margin-top: 2px;
    }

    /* 상단 요약 바 */
    .summary-bar {
      display: flex;
      justify-content: space-around;
      padding: 10px;
      background: var(--bg2);
      margin: 10px 14px;
      border-radius: var(--radius-sm);
      text-align: center;
    }
    .s-item { font-size: 11px; color: var(--txt2); }
    .s-val { font-size: 14px; font-weight: 700; color: var(--txt); margin-top: 2px; }
    .s-val.warn { color: var(--red); }
    .s-val.caution { color: var(--orange); }
    .s-val.ok { color: var(--green); }
    .s-val.blue { color: var(--blue); }
  </style>
</head>
<body>

  <!-- 요약 현황 바 -->
  <div class="summary-bar">
    <div class="s-item">전방 간격<div class="s-val" id="sumFront">--</div></div>
    <div class="s-item">후방 간격<div class="s-val" id="sumRear">--</div></div>
  </div>

  <!-- 내 열차 기준 간격 패널 -->
  <div class="gap-panel">
    <div class="gap-panel-title">🚇 내 열차 기준 간격 모니터링</div>
    <div class="gap-row">
      
      <!-- 1. 전방 열차 카드 -->
      <div class="gap-box" id="frontBox">
        <div class="gap-dir">▲ 전방 열차</div>
        <div class="gap-train-no" id="frontTrainNo">----</div>
        <div class="gap-time" id="frontTime">--</div>
        <div class="gap-stn" id="frontStn">--</div>
        <div class="gap-stations" id="frontStns">--</div>
      </div>

      <!-- 2. 내 열차 (기준) 카드 -->
      <div class="gap-box my-box">
        <div class="gap-dir" style="color:var(--gold)">● 현재 내 열차</div>
        <div class="gap-train-no" id="myTrainNoDisplay">설정 필요</div>
        <div class="gap-stn" id="myStnName" style="color:var(--gold); font-size:13px; font-weight:700;">--</div>
      </div>

      <!-- 3. 후방 열차 카드 -->
      <div class="gap-box" id="rearBox">
        <div class="gap-dir">▼ 후방 열차</div>
        <div class="gap-train-no" id="rearTrainNo">----</div>
        <div class="gap-time" id="rearTime">--</div>
        <div class="gap-stn" id="rearStn">--</div>
        <div class="gap-stations" id="rearStns">--</div>
      </div>

    </div>
  </div>

  <script>
    // 상태 및 더미 데이터 구조 예시
    let MY_TRAIN_ID = "901"; // 내 열차 ID/번호 설정 예시
    let MY_TRAIN_MANUAL = "";
    const N = 38;
    const STATIONS = Array.from({length: N}, (_, i) => ({ n: `역${i+1}` }));

    // 예시 시뮬레이션 열차 데이터
    let simTrains = [
      { id: "900", num: "900", pos: 12.2 },
      { id: "901", num: "901", pos: 10.0 },
      { id: "902", num: "902", pos: 7.8 }
    ];

    function timeClass(sec) {
      if (sec < 120) return 'warn';
      if (sec < 240) return 'caution';
      return 'ok';
    }

    function secToStr(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}분 ${s}초`;
    }

    function calcGaps(my) {
      // 간격 계산 로직 예시 (전방/후방 차간거리 기반 계산)
      return {
        front: { train: simTrains[0], sec: 185, stns: 2 },
        rear: { train: simTrains[2], sec: 210, stns: 2 }
      };
    }

    function updateGapPanel() {
      const myTrainNoEl = document.getElementById('myTrainNoDisplay');
      const frontTrainNoEl = document.getElementById('frontTrainNo');
      const rearTrainNoEl = document.getElementById('rearTrainNo');

      if (!MY_TRAIN_ID) {
        if(myTrainNoEl) myTrainNoEl.textContent = '미설정';
        if(frontTrainNoEl) frontTrainNoEl.textContent = '----';
        if(rearTrainNoEl) rearTrainNoEl.textContent = '----';
        document.getElementById('myStnName').textContent = '미설정';
        document.getElementById('frontTime').textContent = '--';
        document.getElementById('rearTime').textContent = '--';
        return;
      }

      const my = simTrains.find(t => String(t.id).trim() === MY_TRAIN_ID || String(t.num).trim() === MY_TRAIN_ID);
      if (!my) {
        if(myTrainNoEl) myTrainNoEl.textContent = MY_TRAIN_MANUAL || '미운행';
        if(frontTrainNoEl) frontTrainNoEl.textContent = '----';
        if(rearTrainNoEl) rearTrainNoEl.textContent = '----';
        document.getElementById('myStnName').textContent = '미운행';
        document.getElementById('frontTime').textContent = '--';
        document.getElementById('rearTime').textContent = '--';
        return;
      }

      // 내 열차 정보 바인딩
      if(myTrainNoEl) myTrainNoEl.textContent = my.num + '호';
      const myIdx = Math.round(my.pos);
      document.getElementById('myStnName').textContent = (STATIONS[Math.min(myIdx, N - 1)]?.n || '') + '역';

      const g = calcGaps(my);

      // 전방 열차 바인딩
      if (g && g.front) {
        const cls = timeClass(g.front.sec);
        document.getElementById('frontBox').className = 'gap-box ' + cls;
        if(frontTrainNoEl) frontTrainNoEl.textContent = g.front.train.num + '호';
        document.getElementById('frontTime').className = 'gap-time ' + cls;
        document.getElementById('frontTime').textContent = secToStr(g.front.sec);
        document.getElementById('frontStn').textContent = STATIONS[Math.min(Math.round(g.front.train.pos), N - 1)].n + '역';
        document.getElementById('frontStns').textContent = g.front.stns + '역 앞';
        document.getElementById('sumFront').textContent = secToStr(g.front.sec);
        document.getElementById('sumFront').className = 's-val ' + cls;
      } else {
        if(frontTrainNoEl) frontTrainNoEl.textContent = '없음';
      }

      // 후방 열차 바인딩
      if (g && g.rear) {
        const cls = timeClass(g.rear.sec);
        document.getElementById('rearBox').className = 'gap-box ' + cls;
        if(rearTrainNoEl) rearTrainNoEl.textContent = g.rear.train.num + '호';
        document.getElementById('rearTime').className = 'gap-time ' + cls;
        document.getElementById('rearTime').textContent = secToStr(g.rear.sec);
        document.getElementById('rearStn').textContent = STATIONS[Math.min(Math.round(g.rear.train.pos), N - 1)].n + '역';
        document.getElementById('rearStns').textContent = g.rear.stns + '역 뒤';
        document.getElementById('sumRear').textContent = secToStr(g.rear.sec);
        document.getElementById('sumRear').className = 's-val blue';
      } else {
        if(rearTrainNoEl) rearTrainNoEl.textContent = '없음';
      }
    }

    // 초기 실행
    updateGapPanel();
  </script>
</body>
</html>
